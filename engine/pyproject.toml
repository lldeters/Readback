# Tooling configuration for the Readback analysis engine. The engine is not published as a
# Python package; it ships inside the VSIX and runs as `python -I -S -X utf8 run_engine.py`.
[project]
name = "readback-engine"
version = "0.0.1"
description = "Static analysis engine of the Readback VS Code extension (bundled, not published)."
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["vendor", "tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PTH", "S", "TID", "BLE", "T20"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"socket".msg = "The engine must never use the network (spec 5.2)."
"ssl".msg = "The engine must never use the network (spec 5.2)."
"http".msg = "The engine must never use the network (spec 5.2)."
"urllib.request".msg = "The engine must never use the network (spec 5.2)."
"ftplib".msg = "The engine must never use the network (spec 5.2)."
"smtplib".msg = "The engine must never use the network (spec 5.2)."
"subprocess".msg = "The engine must never start processes or run user code (spec 5.2)."
"multiprocessing".msg = "The engine must never start processes or run user code (spec 5.2)."
"ctypes".msg = "The engine must not load native code."
"os.system".msg = "The engine must never start processes or run user code (spec 5.2)."
"os.popen".msg = "The engine must never start processes or run user code (spec 5.2)."
"os.startfile".msg = "The engine must never start processes or run user code (spec 5.2)."

[tool.ruff.lint.per-file-ignores]
# Tests may assert, print, compare against literals and spawn the engine as a subprocess.
"tests/**" = ["S101", "S603", "T20", "TID251", "PLR2004", "PLR0913"]
# The bootstrap must stay parseable by old Pythons so it can report "python-too-old".
"run_engine.py" = ["UP", "PTH"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["readback_engine", "tests", "run_engine.py"]
mypy_path = "vendor"

[[tool.mypy.overrides]]
module = ["sqlglot.*", "jedi.*", "parso.*"]
follow_imports = "silent"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "vendor"]
addopts = ["-ra", "--import-mode=importlib", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["readback_engine"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
